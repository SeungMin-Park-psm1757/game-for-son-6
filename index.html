<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="GoalPop Arena Web is an original lightweight 1v1 arcade soccer game built for mobile and desktop browsers."
    />
    <title>GoalPop Arena Web</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./assets/app.css" />
  </head>
  <body>
    <div id="app">
      <div id="game-shell"></div>
      <div id="rotate-prompt">
        <div class="rotate-card">
          <h1>Landscape Recommended</h1>
          <p>GoalPop Arena feels best in landscape, but you can keep going in portrait if needed.</p>
          <button id="rotate-continue" type="button">Continue Anyway</button>
        </div>
      </div>
    </div>
    <script type="module" src="./assets/app.js"></script>
  </body>
</html>
