<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="모바일과 PC에서 즐기는 1대1 아케이드 축구 게임 골팝 아레나" />
    <meta name="theme-color" content="#082030" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>골팝 아레나</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./assets/app.css" />
  </head>
  <body>
    <div id="app">
      <div id="game-shell"></div>
      <div id="rotate-prompt">
        <div class="rotate-card">
          <h1>가로 화면 권장</h1>
          <p>골팝 아레나는 가로 화면에서 가장 보기 좋습니다. 계속 진행을 누르면 전체화면을 시도하고 그대로 플레이할 수 있습니다.</p>
          <button id="rotate-continue" type="button">계속 진행</button>
        </div>
      </div>
    </div>
    <script type="module" src="./assets/app.js"></script>
  </body>
</html>
